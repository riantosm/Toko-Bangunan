[project]
name = "api"
version = "0.1.0"
description = "Toko Bangunan API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "eval"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
# third-party packages that ship no type information
module = ["reportlab.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is intentional

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]
"tests/*" = ["S101"]
"app/services/metrics_service.py" = ["E501"]  # embedded SQL strings
"app/reports/daily.py" = ["E501"]  # embedded SQL strings
