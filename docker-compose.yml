services:
  db:
    image: postgres:16
    container_name: toko_db
    environment:
      POSTGRES_USER: toko
      POSTGRES_PASSWORD: toko_dev_pw
      POSTGRES_DB: tokobangunan
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toko -d tokobangunan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
